function midoProductManagerTab(tab) {
  const list = document.getElementById('mido-products-list-view');
  const media = document.getElementById('mido-products-media-view');

  if (!list || !media) return;

  list.hidden = tab !== 'list';
  media.hidden = tab !== 'media';

  const buttons = document.querySelectorAll(
    '.mido-product-tabs button'
  );

  buttons.forEach((button, index) => {
    button.classList.toggle(
      'active',
      tab === (index === 0 ? 'list' : 'media')
    );
  });
}

function midoRestockNumber(value) {
  const n = Number(value);
  return Number.isSafeInteger(n) && n >= 0 ? n : 0;
}

function midoRestockProductOptions(filter = '') {
  const search = String(filter).trim().toLowerCase();

  return get('products')
    .filter(p => [
      p.name_ar, p.name_en, p.sku, p.barcode

    .map(p => `

        ${E(p.name_ar || p.name_en || 'Product')}
        ${p.sku ? ` — ${E(p.sku)}` : ''}
      </option>
    `).join('');
}

function midoFilterRestockProducts(query) {
  const select = document.getElementById('mido-restock-product');
  if (!select) return;

  const previous = select.value;

  select.innerHTML = `
    <option value="">${txt('اختر المنتج', 'Select product')}</option>
    ${midoRestockProductOptions(query)}
  `;

  if ([...select.options].some(o => o.value === previous)) {
    select.value = previous;
  } else {
    select.value = '';
  }

  midoRestockProductChanged();
}

function midoRestockProductChanged() {
  const form = document.getElementById('mido-restock-form');
  if (!form) return;

  const id = form.elements.product_id.value;
  const stock = get('inventory').find(x => x.product_id === id);
  const rule = get('mido_restock_rules').find(x => x.product_id === id);

  document.getElementById('mido-restock-current-qty').textContent =
    stock ? stock.quantity : '—';

  form.elements.auto_enabled.checked = !!rule?.enabled;
  form.elements.threshold.value = rule?.threshold_qty ?? 0;
  form.elements.auto_quantity.value = rule?.add_quantity ?? 10;
  form.elements.reserve_quantity.value = rule?.reserve_quantity ?? 0;

  midoRestockToggleFields();
}

function midoRestockToggleFields() {
  const form = document.getElementById('mido-restock-form');
  if (!form) return;

  const mode = form.elements.mode.value;
  const auto = form.elements.auto_enabled.checked;
    form.elements.reason.closest('.field').hidden =
    mode !== 'now';

  document.getElementById('mido-restock-quantity-section').hidden =
    mode === 'none';

  document.getElementById('mido-restock-date-section').hidden =
    mode !== 'schedule';

  document.getElementById('mido-restock-auto-fields').hidden =
    !auto;
}

async function midoSaveRestock(form) {
  if (!state.staff || !perm('inventory.manage')) {
    return toast(txt('غير مصرح', 'Access denied'), true);
  }

  const f = new FormData(form);
  const id = String(f.get('product_id') || '');
  const mode = String(f.get('mode') || 'now');

  const quantity = Number(f.get('quantity'));
  const threshold = Number(f.get('threshold'));
  const autoQuantity = Number(f.get('auto_quantity'));
  const reserve = Number(f.get('reserve_quantity'));
  const enabled = f.get('auto_enabled') === 'on';

  if (!id || !by('products', id)) {
    return toast(txt('اختر منتجًا', 'Select a product'), true);
  }

  const validInt = (n, min, max) =>
    Number.isSafeInteger(n) && n >= min && n <= max;

  if (mode !== 'none' && !validInt(quantity, 1, 100000)) {
    return toast(txt('الكمية غير صحيحة', 'Invalid quantity'), true);
  }

  if (enabled && (
    !validInt(threshold, 0, 100000) ||
    !validInt(autoQuantity, 1, 100000) ||
    !validInt(reserve, 0, 1000000)
  )) {
    return toast(txt('راجع إعدادات الريستوك التلقائي', 'Invalid automatic restock settings'), true);
  }

  const previousRule = get('mido_restock_rules')
    .find(x => x.product_id === id);

  const needsRuleUpdate = enabled || !!previousRule;

  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;

  let completedSteps = 0;

  try {
    if (needsRuleUpdate) {
      const { error } = await state.db.rpc('mido_restock_save_rule', {
        p_product: id,
        p_enabled: enabled,
        p_threshold: enabled ? threshold : (previousRule?.threshold_qty ?? 0),
        p_add_quantity: enabled ? autoQuantity : (previousRule?.add_quantity ?? 10),
        p_reserve: enabled ? reserve : (previousRule?.reserve_quantity ?? 0)
      });

      if (error) throw error;
      completedSteps++;
    }

    if (mode === 'now') {
      const reason = String(f.get('reason') || '').trim();

      if (reason.length < 3) {
        throw Error('اكتب سببًا واضحًا لإضافة المخزون');
      }

      const { error } = await state.db.rpc('adjust_inventory', {
        p_product: id,
        p_delta: quantity,
        p_reason: `Manual restock: ${reason}`
      });

      if (error) throw error;
      completedSteps++;
    }

    if (mode === 'schedule') {
      const dateText = String(f.get('scheduled_at') || '');
      const date = new Date(dateText);

      if (!dateText || !Number.isFinite(date.getTime()) ||
          date.getTime() <= Date.now()) {
        throw Error('اختار موعدًا مستقبليًا صحيحًا');
      }

      const { error } = await state.db.rpc('mido_restock_schedule', {
        p_product: id,
        p_quantity: quantity,
        p_scheduled_at: date.toISOString()
      });

      if (error) throw error;
      completedSteps++;
    }

    form.closest('.overlay')?.removeAttribute('data-unsaved');
    closeModal(true);

    await loadAdminData();
    render();

    toast(txt('تم حفظ عملية الريستوك', 'Restock saved'));

  } catch (error) {
    toast(
      completedSteps
        ? txt(
            'تم تنفيذ جزء من العملية. راجع حركة المخزون وإعدادات الريستوك قبل المحاولة مجددًا.',
            'Partially completed. Check the stock log before retrying.'
          )
        : friendlyError(error),
      true
    );
  } finally {
    button.disabled = false;
  }
}

function midoFilterProducts() {
  const query = (
    document.getElementById('mido-product-search')?.value || ''
  ).trim().toLowerCase();

  const status = document.getElementById(
    'mido-product-status'
  )?.value || 'all';

  let visible = 0;

  document.querySelectorAll('.mido-product-row')
    .forEach(row => {
      const matchesSearch =
        row.dataset.search.includes(query);

      const matchesStatus =
        status === 'all' ||
        (status === 'low'
          ? row.dataset.low === '1'
          : row.dataset.status === status);

      const show = matchesSearch && matchesStatus;

      row.hidden = !show;

      if (show) visible++;
    });

  const empty = document.getElementById(
    'mido-products-no-results'
  );

  if (empty) empty.hidden = visible > 0;
}

async function midoCopyMediaUrl(button) {
  const url = button.dataset.copyUrl || '';

  try {
    await navigator.clipboard.writeText(url);
    toast(txt('تم نسخ الرابط', 'URL copied'));
  } catch {
    toast(
      txt('تعذر النسخ التلقائي، انسخ الرابط من الحقل', 'Copy the URL manually'),
      true
    );
  }
}

function adminDashboardRange() {
  return window.__adminDashboardRange || '30';
}

function setAdminDashboardRange(value) {
  window.__adminDashboardRange = value || '30';
  render();
}

function adminDashNum(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}

function adminDashDate(value) {
  const d = new Date(value || 0);
  return Number.isNaN(d.getTime()) ? null : d;
}

function adminDashStartDate(range) {
  if (range === 'all') return null;

  const now = new Date();

  if (range === 'today') {
    return new Date(now.getFullYear(), now.getMonth(), now.getDate());
  }

  const days = Number(range || 30);
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() - (days - 1));
  return start;
}

function adminDashInRange(row, range = adminDashboardRange(), dateField = 'created_at') {
  if (range === 'all') return true;

  const raw = row?.[dateField] || row?.created_at || row?.updated_at || row?.recorded_at;
  const d = adminDashDate(raw);
  if (!d) return false;

  const start = adminDashStartDate(range);
  if (!start) return true;

  return d >= start;
}

function adminDashBuildData() {
  const range = adminDashboardRange();

  const orders = (get('orders') || []);
  const orderItems = (get('order_items') || []);
  const profiles = (get('profiles') || []);
  const inventory = (get('inventory') || []);
  const productsRows = (get('products') || []);
  const bookings = (get('service_bookings') || []);
  const movements = (get('inventory_movements') || []);

  const filteredOrders = orders.filter(x => adminDashInRange(x, range, 'created_at'));
  const filteredProfiles = profiles.filter(x => adminDashInRange(x, range, 'created_at'));
  const filteredBookings = bookings.filter(x => adminDashInRange(x, range, 'created_at'));
  const filteredMovements = movements.filter(x => adminDashInRange(x, range, 'created_at'));

  const deliveredOrders = filteredOrders.filter(x => x.status === 'delivered');
  const revenue = deliveredOrders.reduce((sum, x) => sum + adminDashNum(x.total), 0);

  const pendingOrders = orders.filter(x =>
    ['received', 'confirmed', 'preparing', 'shipped', 'out_for_delivery'].includes(x.status)
  ).length;

  const lowStockRows = inventory.filter(x =>
    adminDashNum(x.quantity) <= adminDashNum(x.min_quantity)
  );

  const inventoryValue = inventory.reduce((sum, row) => {
    const product = by('products', row.product_id) || {};
    const unitCost = adminDashNum(
      row.unit_cost ??
      row.cost_price ??
      product.cost_price ??
      product.purchase_price ??
      product.wholesale_price ??
      product.price
    );

    return sum + (adminDashNum(row.quantity) * unitCost);
  }, 0);

  const totalUnits = inventory.reduce((sum, row) => sum + adminDashNum(row.quantity), 0);

  const avgOrder = filteredOrders.length
    ? filteredOrders.reduce((sum, x) => sum + adminDashNum(x.total), 0) / filteredOrders.length
    : 0;

  const rangeOrderIds = new Set(filteredOrders.map(x => x.id));

  const topMap = {};

  orderItems.forEach(item => {
    if (!rangeOrderIds.has(item.order_id)) return;

    const product = by('products', item.product_id) || {};
    const key = item.product_id || item.item_name || item.id;

    if (!topMap[key]) {
      topMap[key] = {
        id: key,
        name: product.name_ar || product.name_en || item.item_name || txt('منتج', 'Product'),
        qty: 0,
        sales: 0
      };
    }

    topMap[key].qty += adminDashNum(item.quantity);
    topMap[key].sales += adminDashNum(item.line_total || (adminDashNum(item.unit_price) * adminDashNum(item.quantity)));
  });

  const topProducts = Object.values(topMap)
    .sort((a, b) => b.qty - a.qty)
    .slice(0, 6);

  const alerts = [];

  if (lowStockRows.length) {
    alerts.push({
      tone: 'danger',
      icon: 'alert',
      title: txt('تنبيه مخزون منخفض', 'Low stock alert'),
      body: txt(`${lowStockRows.length} منتجات وصلت للحد الأدنى أو أقل`, `${lowStockRows.length} products are at or below minimum stock`),
      link: '#/admin/inventory'
    });
  }

  if (pendingOrders) {
    alerts.push({
      tone: 'warn',
      icon: 'orders',
      title: txt('طلبات تحتاج متابعة', 'Orders need attention'),
      body: txt(`${pendingOrders} طلبات لم تُغلق بعد`, `${pendingOrders} orders are still open`),
      link: '#/admin/orders'
    });
  }

  const pendingBookings = bookings.filter(x => x.status === 'pending').length;
  if (pendingBookings) {
    alerts.push({
      tone: 'info',
      icon: 'bookings',
      title: txt('حجوزات صيانة معلقة', 'Pending bookings'),
      body: txt(`${pendingBookings} حجوزات في انتظار المتابعة`, `${pendingBookings} bookings waiting for follow-up`),
      link: '#/admin/service_bookings'
    });
  }

  if (!alerts.length) {
    alerts.push({
      tone: 'success',
      icon: 'trending',
      title: txt('الوضع مستقر', 'Everything looks good'),
      body: txt('لا توجد تنبيهات حرجة حالياً', 'No critical alerts right now'),
      link: '#/admin/overview'
    });
  }

  const activities = [
    ...filteredOrders.map(x => ({
      icon: 'orders',
      title: txt('طلب جديد', 'New order'),
      body: `#${x.order_number || x.id} • ${fmt(x.total || 0)}`,
      time: x.created_at || x.updated_at
    })),
    ...filteredProfiles.map(x => ({
      icon: 'customers',
      title: txt('عميل جديد', 'New customer'),
      body: E(x.full_name || x.email || txt('بدون اسم', 'No name')),
      time: x.created_at || x.updated_at
    })),
    ...filteredBookings.map(x => ({
      icon: 'bookings',
      title: txt('حجز صيانة', 'Service booking'),
      body: `${txt('الحالة', 'Status')}: ${E(x.status || '-')}`,
      time: x.created_at || x.updated_at
    })),
    ...filteredMovements.map(x => {
      const product = by('products', x.product_id);
      const delta = adminDashNum(x.quantity_delta);
      return {
        icon: 'inventory',
        title: txt('حركة مخزون', 'Inventory movement'),
        body: `${E(product?.name_ar || product?.name_en || txt('منتج', 'Product'))} • ${delta > 0 ? '+' : ''}${delta}`,
        time: x.created_at || x.updated_at || x.recorded_at
      };
    })
  ]
    .filter(x => x.time)
    .sort((a, b) => new Date(b.time) - new Date(a.time))
    .slice(0, 8)
    .map(x => ({
      ...x,
      timeText: humanDate(x.time)
    }));

  const recentOrders = filteredOrders
    .slice()
    .sort((a, b) => new Date(b.created_at || b.updated_at || 0) - new Date(a.created_at || a.updated_at || 0))
    .slice(0, 6);

  const stockMovements = movements
    .slice()
    .sort((a, b) => new Date(b.created_at || b.updated_at || b.recorded_at || 0) - new Date(a.created_at || a.updated_at || a.recorded_at || 0))
    .slice(0, 6)
    .map(row => {
      const product = by('products', row.product_id);
      return {
        productName: product?.name_ar || product?.name_en || txt('منتج', 'Product'),
        reason: row.reason || row.note || row.notes || txt('بدون سبب', 'No reason'),
        delta: adminDashNum(row.quantity_delta),
        when: humanDate(row.created_at || row.updated_at || row.recorded_at || '')
      };
    });

  const stats = [
    {
      label: txt('إجمالي المبيعات', 'Sales total'),
      value: fmt(revenue),
      note: txt('المبيعات المكتملة خلال الفترة', 'Completed sales in selected period'),
      icon: 'sales',
      link: '#/admin/orders'
    },
    {
      label: txt('إجمالي الطلبات', 'Total orders'),
      value: filteredOrders.length,
      note: txt('عدد الطلبات خلال الفترة', 'Orders during selected period'),
      icon: 'orders',
      link: '#/admin/orders'
    },
    {
      label: txt('متوسط الطلب', 'Average order'),
      value: fmt(avgOrder),
      note: txt('متوسط قيمة الطلب', 'Average order value'),
      icon: 'trending',
      link: '#/admin/orders'
    },
    {
      label: txt('عملاء جدد', 'New customers'),
      value: filteredProfiles.length,
      note: txt('حسابات جديدة خلال الفترة', 'New accounts during selected period'),
      icon: 'customers',
      link: '#/admin/customers'
    },
    {
      label: txt('حجوزات الصيانة', 'Service bookings'),
      value: filteredBookings.length,
      note: txt('حجوزات جديدة خلال الفترة', 'New bookings during selected period'),
      icon: 'bookings',
      link: '#/admin/service_bookings'
    },
    {
      label: txt('مخزون منخفض', 'Low stock'),
      value: lowStockRows.length,
      note: txt('منتجات تحتاج توريد', 'Products that need restocking'),
      icon: 'stock',
      link: '#/admin/inventory'
    },
    {
      label: txt('قيمة المخزون', 'Inventory value'),
      value: fmt(inventoryValue),
      note: txt('بتكلفة الشراء', 'Based on purchase cost'),
      icon: 'value',
      link: '#/admin/inventory'
    },
    {
      label: txt('إجمالي الوحدات', 'Total units'),
      value: totalUnits,
      note: txt('الوحدات الموجودة بالمخزون', 'Units currently in inventory'),
      icon: 'inventory',
      link: '#/admin/inventory'
    }
  ];

  return {
    range,
    stats,
    alerts,
    activities,
    topProducts,
    recentOrders,
    stockMovements,
    inventoryValue,
    totalUnits,
    productsCount: productsRows.length,
    lowStockCount: lowStockRows.length
  };
}

function adminDashBuildChartSeries(range = adminDashboardRange()) {
  const orders = get('orders') || [];
  const delivered = orders.filter(x => x.status === 'delivered');

  if (range === 'all') {
    const labels = [];
    const ordersSeries = [];
    const salesSeries = [];

    for (let i = 11; i >= 0; i--) {
      const d = new Date();
      d.setDate(1);
      d.setMonth(d.getMonth() - i);

      const y = d.getFullYear();
      const m = d.getMonth();

      labels.push(
        d.toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-US', { month: 'short' })
      );

      const monthOrders = orders.filter(x => {
        const dx = adminDashDate(x.created_at || x.updated_at);
        return dx && dx.getFullYear() === y && dx.getMonth() === m;
      });

      const monthSales = delivered
        .filter(x => {
          const dx = adminDashDate(x.created_at || x.updated_at);
          return dx && dx.getFullYear() === y && dx.getMonth() === m;
        })
        .reduce((sum, x) => sum + adminDashNum(x.total), 0);

      ordersSeries.push(monthOrders.length);
      salesSeries.push(monthSales);
    }

    return { labels, ordersSeries, salesSeries };
  }

  const days = range === 'today' ? 1 : Number(range || 30);
  const labels = [];
  const ordersSeries = [];
  const salesSeries = [];

  for (let i = days - 1; i >= 0; i--) {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - i);

    const next = new Date(d);
    next.setDate(next.getDate() + 1);

    labels.push(
      days === 1
        ? txt('اليوم', 'Today')
        : d.toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-US', {
            day: 'numeric',
            month: days > 31 ? 'short' : undefined
          })
    );

    const dayOrders = orders.filter(x => {
      const dx = adminDashDate(x.created_at || x.updated_at);
      return dx && dx >= d && dx < next;
    });

    const daySales = delivered
      .filter(x => {
        const dx = adminDashDate(x.created_at || x.updated_at);
        return dx && dx >= d && dx < next;
      })
      .reduce((sum, x) => sum + adminDashNum(x.total), 0);

    ordersSeries.push(dayOrders.length);
    salesSeries.push(daySales);
  }

  return { labels, ordersSeries, salesSeries };
}

  if (!isOverview) return;

  const canvas = document.getElementById(
    'adminOverviewMainChart'
  );

  if (!canvas) return;

  if (typeof Chart === 'undefined') {
    if (tries < 20) {
      setTimeout(() => {
        initAdminOverviewPage(tries + 1);
      }, 200);
    }
    return;

  const range = adminDashboardRange();
  const series = adminDashBuildChartSeries(range);

  const locale = lang === 'ar' ? 'ar-EG' : 'en-US';

    const date = new Date();
    date.setHours(0, 0, 0, 0);

    if (range === 'all') {

async function uploadCategoryImage(input) {
  const file = input.files?.[0];
  if (!file) return;

  const progress = document.getElementById(
    'category-upload-progress'
  );

  const imageField = document.getElementById(
    'admin-media-image_url'
  );

  const form = input.closest('form');
  const saveButton = form?.querySelector(
    'button[type="submit"], button:not([type])'
  );

  const allowed = [
    'image/jpeg',
    'image/png',
    'image/webp',
    'image/gif'
  ];

  if (!allowed.includes(file.type)) {
    toast(
      txt('صيغة الصورة غير مدعومة', 'Unsupported image format'),
      true
    );
    input.value = '';
    return;
  }

  input.disabled = true;
  input.dataset.uploading = '1';

  if (saveButton) saveButton.disabled = true;

  if (progress) {
    progress.textContent = txt(
      'جاري رفع الصورة...',
      'Uploading image...'
    );
  }

  try {
    const url = await uploadToImgBB(file);

    if (imageField) {
      imageField.value = url;
      imageField.dispatchEvent(
        new Event('change', { bubbles: true })
      );
    }

    if (progress) {
      progress.textContent = txt(
        'تم رفع الصورة بنجاح',
        'Image uploaded successfully'
      );
    }

    toast(
      txt('تم رفع الصورة', 'Image uploaded')
    );

  } catch (error) {
    if (progress) {
      progress.textContent = txt(
        'فشل رفع الصورة، حاول مرة أخرى',
        'Upload failed, please try again'
      );
    }

    toast(friendlyError(error), true);
    input.value = '';

  } finally {
    input.disabled = false;
    delete input.dataset.uploading;

    if (saveButton) saveButton.disabled = false;
  }
}

function adminField(table, spec, record) {

  const [key, kind = '', opts = ''] = spec.split(':');
  const val = record?.[key];
  const label = key.replaceAll('_', ' ');
  
  if (table === 'categories' && key === 'image_url') {
    return `
      <div class="field wide">
        <label>
          ${txt('صورة التصنيف', 'Category Image')}
        </label>

        ${val ? `
          <img
            src="${E(safeUrl(val))}"
            alt="Category"
            style="width:110px;height:100px;
                   object-fit:contain;
                   border:1px solid #ddd;
                   border-radius:10px;
                   margin-bottom:10px"
          >
        ` : ''}

        <input
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
          onchange="uploadCategoryImage(this)"
        >

        <textarea
          class="input"
          id="admin-media-image_url"
          rows="1"
          placeholder="https://..."
          style="margin-top:10px"
        >${E(val || '')}</textarea>

        <small
          id="category-upload-progress"
          class="muted"
        ></small>
      </div>
    `;
  }

  if (kind === 'bool') return `<div class="field"><label><input type="checkbox" name="${key}" ${val ? 'checked' : ''}> ${E(label)}</label></div>`;
  if (kind === 'select') return `<div class="field"><label>${E(label)}</label><select name="${key}"><option value="">—</option>${opts.split('|').map(x => `<option ${val === x ? 'selected' : ''}>${E(x)}</option>`).join('')}</select></div>`;
  if (kind === 'image') return `<div class="field wide"><label>${E(label)}</label>${mediaInput('admin-media-' + key, false, val || '')}<input type="hidden" name="${key}" value=""></div>`;
  if ([
    'categories',
    'brands',
    'motorcycle_models',
    'products',
    'bundles',
    'banners',
    'governorates',
    'cities',
    'services',
    'suppliers',
    'purchase_orders',
    'used_motorcycles',
    'customer_motorcycles',
    'service_bookings'
  ].includes(kind)) {
    return `<div class="field"><label>${E(label)}</label><select name="${key}"><option value="">—</option>${get(kind).map(r => `<option value="${r.id}" ${val === r.id ? 'selected' : ''}>${E(r.name_ar || r.name || r.title || r.sku || r.page_key || r.id)}</option>`).join('')}</select></div>`
  }
  if (kind === 'textarea' || [
    'description_ar',
    'description',
    'internal_notes'
  ].includes(key)) return `<div class="field wide"><label>${E(label)}</label><textarea name="${key}">${E(val ?? '')}</textarea></div>`;
  if (kind === 'array') return `<div class="field wide"><label>${E(label)} (${txt('مفصول بفاصلة', 'comma separated')})</label><input name="${key}" value="${E((val || [
  ]).join(', '))}"></div>`;
  return `<div class="field"><label>${E(label)}</label><input name="${key}" type="${kind === 'color' ? 'color' : kind === 'datetime' ? 'datetime-local' : [
    'num',
    'int'
  ].includes(kind) ? 'number' : 'text'}" ${kind === 'num' ? 'step="0.01"' : ''}
 value="${E(kind === 'datetime' && val ? String(val).slice(0, 16) : val ?? '')}"></div>`
}

async function saveAdminRecord(section, id, form) {

  const specs = fieldsFor(section), f = new FormData(form), obj = {
  };
  for (const spec of specs) {

    const [key, kind = ''] = spec.split(':');
    let value;
    if (kind === 'image') value = $('admin-media-' + key)?.value.trim() || null;
    else if (kind === 'bool') value = f.get(key) === 'on';
    else {

      value = String(f.get(key) || '').trim();
      if (value === '') value = null;
      else if ([
        'int',
        'num'
      ].includes(kind)) value = Number(value); else if (kind === 'array') value = value.split(',').map(x => x.trim()).filter(Boolean); else if (kind === 'datetime') value = new Date(value).toISOString();
    }

    obj[key] = value;
  }

  // Generate a slug automatically for new categories
  if (section === 'categories' && !id) {
    obj.slug = 'cat-' + crypto.randomUUID().replace(/-/g, '').slice(0, 16);
  }

  const key = keyCol(section);
  try {


    const q = state.db.from(section);
    let result;
    if (id) {
      const rec = get(section).find(x => String(x[key]) === id);
      if (!rec) throw Error('RECORD_NOT_FOUND');
      result = await q.update(obj).eq(key, id)
    }
    else result = await q.insert(obj);
    if (result.error) throw result.error;
    closeModal();
    await loadAdminData();
    render();
    toast(txt('تم حفظ التغييرات', 'Changes saved'));

  } catch (e) {
    toast(friendlyError(e), true)
  }
}

  } catch (e) {

  }
}

async function continueBookingFlow(input) {

  const f = state.chatFlow, step = f.step;
  if (step === 'confirm') {

    const yes = /^(ايوه|اه|نعم|موافق|اكد|تأكيد|yes|confirm|ok)$/i.test(normalizeArabic(input));
    if (!yes) {
      say(txt('تم إيقاف الحجز، لم يتم حفظ أي طلب.', 'Booking cancelled; nothing was submitted.'));
      state.chatFlow = null;
      return
    }
    try {
      const out = await callEdge('book-service', {
        model_id: f.model,
        year: f.year,
        service_id: f.service,
        slot_id: f.slot,
        name: f.name,
        phone: f.phone
      });
      say(txt('تم تسجيل طلب الحجز! رقم الحجز: ', 'Booking submitted. Reference: ') + out.booking_number)
    }
    catch (e) {
      say(friendlyError(e))
    }
    state.chatFlow = null;
    return;
  }
  if (step === 'name') {
    if (input.length < 3) {
      say(txt('اكتب اسمك بالكامل.', 'Please enter your full name.'));
      return
    }
    f.name = input;
    f.step = 'phone';
    say(txt('اكتب رقم الموبايل.', 'Enter your phone number.'));
    return
  }
  if (step === 'phone') {
    if (!/^\+?[0-9٠-٩ ]{10,17}$/.test(input)) {
      say(txt('رقم الموبايل غير صالح. جرّب تاني.', 'Invalid phone number; try again.'));
      return
    }
    f.phone = input;
    f.step = 'confirm';
    say(`${txt('راجع تفاصيل الحجز قبل التأكيد:', 'Review booking before submitting:')}\n${by('motorcycle_models', f.model)?.name || ''} ${f.year}\n${by('services', f.service)?.name_ar || ''}\n${humanDate(by('available_slots', f.slot)?.starts_at)}\n${f.name} — ${f.phone}\n${txt('اكتب "نعم" للتأكيد أو "إلغاء".', 'Type yes to confirm or cancel.')}`);
    return
  }
  const options = bookingOptions(step, f), picked = choiceFromMessage(input, options);
  if (!picked) {
    say(txt('الاختيار غير واضح. اكتب رقم من القائمة.', 'Select a number from the list.'));
    bookingPrompt();
    return
  }
  f[step] = picked.id;
  f.step = {
    brand: 'model',
    model: 'year',
    year: 'service',
    service: 'slot',
    slot: 'name'
  }[step];
  if (f.step === 'name') say(txt('اكتب اسمك بالكامل لإتمام طلب الحجز.', 'Enter your full name to continue.')); else bookingPrompt();
}

async function fetchTable(table, limit = 500) {

  if (!state.db) return [
  ];
  let accumulated = [
  ];
  let start = 0;
  const page = 200;
  while (start < limit) {

    let q = state.db.from(table).select(table === 'products' ? 'id,sku,barcode,name_ar,name_en,slug,description_ar,description_en,category_id,brand_id,price,compare_at_price,is_active,featured,universal_fit,keywords,created_at,updated_at' : '*').range(start, Math.min(start + page - 1, limit - 1));
    const { data, error } = await q;
    if (error) {
      console.warn('Read denied/unavailable:', table, error.message);
      break
    }
    accumulated.push(...(data || [
    ]));
    if (!data || data.length < page) break;
    start += page
  }
  return accumulated;
}

function midoDateKey(value) {
  const d = value ? new Date(value) : new Date();
  if (Number.isNaN(d.getTime())) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function midoTimeAgo(value) {
  const d = value ? new Date(value) : new Date();
  if (Number.isNaN(d.getTime())) return txt('الآن', 'Now');
  const diff = Math.max(1, Math.floor((Date.now() - d.getTime()) / 60000));
  if (diff < 60) return txt(`منذ ${diff} دقيقة`, `${diff} min ago`);
  const hrs = Math.floor(diff / 60);
  if (hrs < 24) return txt(`منذ ${hrs} ساعة`, `${hrs}h ago`);
  const days = Math.floor(hrs / 24);
  return txt(`منذ ${days} يوم`, `${days}d ago`);
}

function midoLastDays(count = 7) {
  const arr = [];
  for (let i = count - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    arr.push(d);
  }
  return arr;
}

function midoCountByDays(rows, dateField, count = 7) {
  const days = midoLastDays(count);
  return days.map(d => {
    const key = midoDateKey(d);
    return rows.filter(x => midoDateKey(x?.[dateField] || x?.created_at || x?.updated_at) === key).length;
  });
}

/* Automatic admin stock synchronization */

let midoStockSyncTimer = null;
let midoStockSyncBusy = false;
let midoStockRenderPending = false;

async function midoSyncAdminStock() {
  if (
    !state.db ||
    !state.staff ||
    !route().startsWith('/admin') ||
    midoStockSyncBusy
  ) return;

  midoStockSyncBusy = true;

  try {
    // Read current stock directly from Supabase.
    const { data: rows, error } = await state.db
      .from('inventory')
      .select('product_id,quantity,min_quantity,updated_at')
      .order('product_id')
      .limit(1000);

    if (error) throw error;

    const previous = get('inventory') || [];
    const oldMap = new Map(
      previous.map(row => [String(row.product_id), row])
    );

    const stockChanged =
      rows.length !== previous.length ||
      rows.some(row => {
        const old = oldMap.get(String(row.product_id));

        return !old ||
          Number(old.quantity) !== Number(row.quantity) ||
          Number(old.min_quantity) !== Number(row.min_quantity);
      });

    // Check scheduled restock completion.
    let completedRestock = false;
    let jobsChanged = false;

    const { data: jobs, error: jobsError } = await state.db
      .from('mido_restock_jobs')
      .select('id,product_id,quantity,status,processed_at')
      .order('created_at', { ascending: false })
      .limit(100);

    if (!jobsError && jobs) {
      const previousJobs = get('mido_restock_jobs') || [];

      const oldJobs = new Map(
        previousJobs.map(job => [String(job.id), job])
      );

      completedRestock = jobs.some(job => {
        const old = oldJobs.get(String(job.id));

        return old?.status === 'pending' &&
          job.status === 'completed';
      });

      jobsChanged = jobs.some(job => {
        const old = oldJobs.get(String(job.id));

        return !old || old.status !== job.status;
      }) || (
        previousJobs.length !== jobs.length &&
        previousJobs.length <= 100
      );
    }

    if (stockChanged || jobsChanged) {
      if (stockChanged) {
        state.data.inventory = await fetchTable('inventory');
        state.data.inventory_movements =
          await fetchTable('inventory_movements');
        state.data.stock_adjustments =
          await fetchTable('stock_adjustments');
      }

      if (jobsChanged) {
        state.data.mido_restock_jobs =
          await fetchTable('mido_restock_jobs');

        state.data.mido_restock_rules =
          await fetchTable('mido_restock_rules');
      }

      // Don't destroy a form while the admin is editing it.
      if (document.querySelector('.overlay')) {
        midoStockRenderPending = true;

        const restockQty = document.getElementById(
          'mido-restock-current-qty'
        );

        const productSelect = document.getElementById(
          'mido-restock-product'
        );

        if (restockQty && productSelect?.value) {
          const stock = get('inventory').find(
            x => String(x.product_id) === productSelect.value
          );

          if (stock) restockQty.textContent = stock.quantity;
        }

      } else if (route().startsWith('/admin')) {
        midoStockRenderPending = false;
        render();
      }

      if (completedRestock) {
        toast(
          txt(
            'تم تنفيذ الريستوك المجدول وتحديث المخزون تلقائيًا.',
            'Scheduled restock completed. Stock updated automatically.'
          )
        );
      }
    }

    // Apply delayed visual update after any modal is closed.
    if (
      midoStockRenderPending &&
      !document.querySelector('.overlay') &&
      route().startsWith('/admin')
    ) {
      midoStockRenderPending = false;
      render();
    }

  } catch (error) {
    console.warn(
      'Automatic stock synchronization failed:',
      error.message
    );

  } finally {
    midoStockSyncBusy = false;
  }
}

function midoStartAdminStockSync() {
  if (midoStockSyncTimer !== null) return;

  // Refresh in-place every five seconds.
  midoStockSyncTimer = setInterval(() => {
    if (!route().startsWith('/admin') || !state.staff) {
      clearInterval(midoStockSyncTimer);
      midoStockSyncTimer = null;
      return;
    }

    midoSyncAdminStock();
  }, 5000);
}

function observeReveal() {

  const elements = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    elements.forEach(x => x.classList.add('visible'));
    return
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        io.unobserve(e.target)
      }
    })
  }, {
    threshold: .06
  });
  elements.forEach(x => io.observe(x));
}

function toggleMobile(value) {
  const menu = document.getElementById('mobile-menu');
  const backdrop = document.querySelector('.mobile-menu-backdrop');
  const button = document.querySelector('.navband .hamburger');

  if (!menu) return;

  const shouldOpen = value === undefined
    ? !menu.classList.contains('open')
    : Boolean(value);

  menu.classList.toggle('open', shouldOpen);
  backdrop?.classList.toggle('open', shouldOpen);

  document.body.classList.toggle('mido-menu-open', shouldOpen);

  button?.setAttribute(
    'aria-expanded',
    String(shouldOpen)
  );

  if (shouldOpen) {
    menu.querySelector('.close')?.focus();
  } else {
    button?.focus({ preventScroll: true });
  }
}

async function boot() {
  render();
  if (!window.supabase) {
    toast(txt('تعذر الاتصال بخدمة الحسابات', 'Authentication service unavailable'), true);
    return;
  }
  state.db = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.publishableKey, {
    auth: {
      persistSession: true,
      autoRefreshToken: true
    }
  });
  try {
    const { data, error } = await state.db.auth.getUser();
    if (error && error.name !== 'AuthSessionMissingError') console.warn('Session unavailable');
    state.user = data?.user || null;
    await loadPublic();
    if (state.user) await loadPrivate();
    state.loading = false;
    render();
    state.db.auth.onAuthStateChange((event, session) => {
      if (session?.user?.id === state.user?.id) return;
      state.user = session?.user || null;
      setTimeout(async () => {
        if (state.user) await loadPrivate(); else {
          state.roles = [
          ];
          state.staff = false;
          state.data.profiles = [
          ];
        }
        render();

      }, 0);

    });

  } catch (e) {
    console.error('Store initialization failed');
    state.loading = false;
    render();
    toast(txt('تعذر تحميل بيانات المتجر', 'Store data unavailable'), true);
  }
}

function updateMobileNavigationMode() {
  const ua = navigator.userAgent || '';

  const mobileByBrowser =
    navigator.userAgentData?.mobile === true ||
    /Android|iPhone|iPad|iPod|Mobile/i.test(ua);

  const touchTablet =
    window.matchMedia('(pointer: coarse)').matches &&
    window.matchMedia('(max-width: 1200px)').matches;

  const compactDesktop =
    window.matchMedia('(max-width: 760px)').matches;

  const useMobileMenu =
    mobileByBrowser || touchTablet || compactDesktop;

  document.documentElement.classList.toggle(
    'mido-mobile-navigation',
    useMobileMenu
  );

  if (!useMobileMenu) {
    toggleMobile(false);
  }
}

document.addEventListener(
  'DOMContentLoaded',
  updateMobileNavigationMode
);

window.addEventListener(
  'resize',

);
