<html lang="ar" dir="rtl">
<head>

<title>Mr Mido Motors | مستر ميدو موتورز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #ffd13b;
  --accent: #e3292f;
  --dark: #0c181a;
  --surface: #fff;
  --ink: #172326;
  --muted: #6a777c;
  --line: #e6eaec;
  --bg: #f5f7f8;
  --radius: 16px;
  --font: "Cairo",sans-serif;
  --fz: 15px;
  --h1: 42px;
  --shadow: 0 9px 25px rgba(17,32,35,.08);
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 var(--fz)/1.8 var(--font);
}
body.modal-open {
  overflow: hidden;
}
button,input,select,textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: .52;
}
a {
  text-decoration: none;
  color: inherit;
}
img {
  max-width: 100%;
  display: block;
}
input,select,textarea {
  color: var(--ink);
}
h1,h2,h3,h4,p {
  margin: 0;
}
h1,h2,h3 {
  line-height: 1.35;
}
h1 {
  font-size: clamp(28px,4vw,var(--h1));
  font-weight: 900;
}
h2 {
  font-size: clamp(22px,2.6vw,30px);
  font-weight: 900;
}
h3 {
  font-size: 19px;
  font-weight: 800;
}
small,.small {
  font-size: 12px;
}
.muted {
  color: var(--muted);
}
.gold {
  color: var(--primary);
}
.red {
  color: var(--accent);
}
.container {
  max-width: 1320px;
  margin: auto;
  padding: 0 24px;
}
.section {
  padding: 30px 0;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}
.section-head .overline {
  color: var(--accent);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .7px;
}
.section-link {
  color: #1d5d63;
  font-weight: 800;
  font-size: 13px;
}
.icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: Arial,sans-serif;
  font-size: 21px;
  line-height: 1;
}
.badge {
  background: var(--primary);
  color: #151a1a;
  font-size: 11px;
  font-weight: 900;
  border-radius: 7px;
  padding: 3px 9px;
}
.pill {
  border: 1px solid var(--line);
  border-radius: 100px;
  padding: 4px 12px;
  font-size: 12px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 0;
  background: var(--dark);
  color: #fff;
  padding: 12px 22px;
  border-radius: 10px;
  font-weight: 800;
  transition: transform .2s,background .2s;
  white-space: nowrap;
}
.btn:hover {
  transform: translateY(-2px);
}
.btn.primary {
  background: var(--primary);
  color: #171b18;
}
.btn.redbtn {
  background: var(--accent);
}
.btn.outline {
  background: transparent;
  border: 1px solid currentColor;
  color: inherit;
}
.btn.white {
  background: #fff;
  color: var(--dark);
}
.btn.sm {
  padding: 8px 13px;
  font-size: 12px;
}
.btn.full {
  width: 100%;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.surface {
  background: #fff;
  border-radius: var(--radius);
  padding: 22px;
  border: 1px solid var(--line);
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0 0 12px;
}
.field label {
  font-size: 12px;
  font-weight: 800;
  color: #35474b;
}
.field input,.field select,.field textarea,.input,.search-input {
  background: #fff;
  width: 100%;
  border: 1px solid #dfe4e6;
  border-radius: 10px;
  min-height: 44px;
  padding: 9px 12px;
  outline: none;
  transition: border-color .2s,box-shadow .2s;
}
.field input:focus,.field select:focus,.field textarea:focus,.search-input:focus {
  border-color: #77a8ab;
  box-shadow: 0 0 0 3px #3d9b9d16;
}
.field textarea {
  min-height: 96px;
  resize: vertical;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 7px 16px;
}
.form-grid .wide {
  grid-column: 1/-1;
}
.notice {
  padding: 12px 16px;
  border: 1px solid #e7c36e;
  border-radius: 12px;
  background: #fffae7;
  font-size: 13px;
  color: #61501b;
}
.info {
  border-color: #bfdde0;
  background: #f0f9fa;
  color: #275c65;
}
.empty {
  text-align: center;
  padding: 40px 22px;
  color: var(--muted);
  background: #fff;
  border: 1px dashed #d8e0e0;
  border-radius: var(--radius);
}
.empty strong {
  display: block;
  color: var(--ink);
  font-size: 18px;
}
.grid {
  display: grid;
  gap: 16px;
}
.grid-4 {
  grid-template-columns: repeat(4,minmax(0,1fr));
}
.grid-3 {
  grid-template-columns: repeat(3,minmax(0,1fr));
}
.grid-2 {
  grid-template-columns: repeat(2,minmax(0,1fr));
}
.flex {
  display: flex;
  gap: 12px;
  align-items: center;
}
.flex.wrap {
  flex-wrap: wrap;
}
.spread {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
}
.line {
  height: 1px;
  background: var(--line);
  margin: 17px 0;
}
.kicker {
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 900;
  font-size: 11px;
  color: var(--primary);
}
.crumb {
  color: var(--muted);
  font-size: 12px;
  margin: 18px 0;
}
.crumb a:hover {
  color: var(--accent);
}
.imgbox {
  overflow: hidden;
  background: #f0f1f2;
  display: grid;
  place-items: center;
}
.imgbox img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.nowrap {
  white-space: nowrap;
}
.text-right {
  text-align: right;
}
.hidden {
  display: none !important;
}
/* Navigation */
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--line);
}
.topbar .inside {
  height: 82px;
  display: flex;
  align-items: center;
  gap: 28px;
  justify-content: space-between;
}
.brand-logo {
  width: 100px;
  height: 75px;
  object-fit: contain;
  background: #020303;
  padding: 5px;
  border-radius: 6px;
}
.searchbar {
  display: flex;
  align-items: center;
  max-width: 550px;
  width: 100%;
  background: #f6f7f8;
  border: 1px solid #e6eaeb;
  border-radius: 100px;
  padding: 4px 6px 4px 10px;
}
.searchbar input {
  width: 100%;
  background: transparent;
  border: 0;
  outline: none;
  padding: 10px 15px;
  font-size: 13px;
}
.searchbar button {
  display: grid;
  place-items: center;
  background: var(--dark);
  border: 0;
  color: #fff;
  border-radius: 50%;
  width: 40px;
  height: 40px;
}
.searchbar button .icon-svg {
  width: 18px;
  height: 18px;
}
.quick-icons {
  display: flex;
  gap: 12px;
  align-items: center;
}
.quick-icon {
  display: flex;
  min-width: 72px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 6px;
  font-size: 10px;
  font-weight: 800;
  position: relative;
  color: #213133;
  text-align: center;
  padding: 6px 4px;
  border-radius: 12px;
  transition: background .2s,color .2s,transform .2s;
}
.quick-icon:hover {
  color: var(--accent);
  background: #f7f9f9;
  transform: translateY(-1px);
}
.quick-icon .icon-badge {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: #f3f6f6;
  border: 1px solid #e2e8e9;
  display: grid;
  place-items: center;
  box-shadow: inset 0 1px 0 #fff;
}
.quick-icon .icon-svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
}
.quick-icon.lang-btn {
  border: 0;
  background: none;
}
.counter {
  position: absolute;
  top: 2px;
  inset-inline-start: 10px;
  border-radius: 999px;
  background: var(--accent);
  color: white;
  font-size: 10px;
  min-width: 18px;
  text-align: center;
  line-height: 18px;
  padding: 0 4px;
  font-weight: 900;
}
.navband {
  background: var(--dark);
  color: #cfd8d7;
  position: sticky;
  top: 0;
  z-index: 60;
  box-shadow: 0 4px 16px #0b181944;
}
.navband .inside {
  display: flex;
  align-items: center;
  min-height: 56px;
  gap: 10px;
  flex-wrap: wrap;
}
.navband a {
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  padding: 10px 14px;
  border-radius: 999px;
  transition: background .2s,color .2s,box-shadow .2s;
}
.navband a:hover,.navband a.active {
  color: #151a19;
  background: var(--primary);
  box-shadow: 0 0 0 1px #ffdc65 inset,0 8px 20px #ffd13b22;
}
.nav-special {
  margin-inline-start: auto;
  background: var(--primary);
  color: #131a19 !important;
  padding: 13px 20px;
  box-shadow: 0 10px 26px #ffd13b24;
}
.hamburger {
  display: none;
  border: 0;
  background: transparent;
  color: inherit;
  padding: 8px;
  font-size: 27px;
}
.hamburger .icon-svg {
  width: 24px;
  height: 24px;
}
.mobile-menu {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0 auto 0 0;
  background: var(--dark);
  color: #fff;
  width: min(350px,90vw);
  padding: 25px;
  box-shadow: 0 0 0 200vmax #0009;
  overflow: auto;
}
.mobile-menu.open {
  display: block;
}
.mobile-menu a {
  display: block;
  padding: 12px;
  border-bottom: 1px solid #ffffff1c;
}
/* Hero */
.hero {
  min-height: 420px;
  background: #0b1415;
  position: relative;
  color: #fff;
  overflow: hidden;
}
.hero-visual {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center 53%;
  filter: saturate(.95) contrast(1.03);
  opacity: .96;
  transform: scale(1.02);
}
.hero:before {
  content: "";
  position: absolute;
  z-index: 1;
  inset: 0;
  background: linear-gradient(90deg,#10151609 15%,#0b1316b0 55%,#071014f0 100%);
}
.hero-inner {
  position: relative;
  z-index: 2;
  min-height: 420px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  max-width: 1320px;
  margin: auto;
  padding: 60px 40px;
}
.hero h1 {
  max-width: 560px;
  line-height: 1.26;
  font-size: clamp(34px,5vw,64px);
  text-shadow: 0 3px 12px #0008;
}
.hero h1 em {
  color: var(--primary);
  font-style: normal;
}
.hero p {
  max-width: 520px;
  margin: 13px 0 25px;
  color: #e7eded;
  font-size: 14px;
}
.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.hero-dots {
  position: absolute;
  z-index: 3;
  bottom: 14px;
  left: 50%;
  display: flex;
  gap: 8px;
  transform: translateX(-50%);
}
.hero-dots button {
  border: 0;
  background: #c8d3ce87;
  border-radius: 100%;
  width: 8px;
  height: 8px;
  padding: 0;
}
.hero-dots button.active {
  background: var(--primary);
  width: 24px;
}
.hero-arrow {
  position: absolute;
  z-index: 3;
  top: 50%;
  border: 1px solid #ffffff52;
  background: #1420247d;
  color: #fff;
  width: 34px;
  height: 42px;
  transform: translateY(-50%);
  font-size: 22px;
}
.hero-arrow.prev {
  left: 14px;
}
.hero-arrow.next {
  right: 14px;
}
.finder {
  position: relative;
  z-index: 4;
  max-width: 1200px;
  margin: -23px auto 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 17px;
  box-shadow: 0 12px 35px #101e2220;
  padding: 18px;
  display: grid;
  grid-template-columns: 1.45fr 1fr 1fr 1fr auto;
  align-items: end;
  gap: 11px;
}
.finder h3 {
  font-size: 15px;
}
.finder p {
  font-size: 11px;
  color: var(--muted);
}
.finder .field {
  margin: 0;
}
.finder .field select {
  min-height: 46px;
}
.finder .btn {
  min-height: 46px;
}
.categories {
  display: grid;
  grid-template-columns: repeat(8,minmax(0,1fr));
  gap: 15px;
}
.cat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  font-weight: 800;
  min-width: 0;
  text-align: center;
}
.cat-circle {
  border-radius: 50%;
  aspect-ratio: 1;
  background: radial-gradient(circle at 70% 28%,#fff,#e0e4e5);
  border: 3px solid #fff;
  box-shadow: 0 5px 15px #0b1b1a17;
  display: grid;
  place-items: center;
  width: 100%;
  max-width: 113px;
  overflow: hidden;
  transition: .2s;
}
.cat-item:hover .cat-circle {
  transform: translateY(-5px);
  box-shadow: 0 9px 23px #152c292c;
}
.cat-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cat-symbol {
  font-size: 43px;
  filter: drop-shadow(0 4px 2px #17212222);
}
.services-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 13px;
}
.service-tile {
  min-height: 140px;
  display: flex;
  justify-content: space-between;
  padding: 18px;
  border-radius: 13px;
  overflow: hidden;
  position: relative;
  background: #e6f0f8;
}
.service-tile:nth-child(2) {
  background: #fff0df;
}
.service-tile:nth-child(3) {
  background: #e2efed;
}
.service-tile:nth-child(4) {
  background: #ece7f7;
}
.service-tile strong {
  display: block;
  font-size: 17px;
}
.service-tile p {
  font-size: 11px;
  color: #4f6569;
  max-width: 170px;
}
.service-tile .service-symbol {
  position: absolute;
  inset-inline-end: -6px;
  bottom: -20px;
  font-size: 78px;
  filter: drop-shadow(3px 3px 3px #2223);
}
.service-tile .tiny-link {
  margin-top: 18px;
  display: block;
  font-size: 11px;
  font-weight: 900;
}
.product-card {
  position: relative;
  min-width: 0;
  transition: transform .2s;
}
.product-card:hover {
  transform: translateY(-4px);
}
.product-card .photo {
  height: 195px;
  background: #f1f2f3;
  display: grid;
  place-items: center;
  overflow: hidden;
  cursor: pointer;
}
.product-card .photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform .3s;
}
.product-card:hover .photo img {
  transform: scale(1.04);
}
.product-card .details {
  padding: 13px 15px;
}
.product-card h3 {
  font-size: 14px;
  min-height: 42px;
  line-height: 1.5;
  cursor: pointer;
}
.price {
  font-size: 17px;
  font-weight: 900;
  color: var(--accent);
}
.old-price {
  color: #96a0a4;
  text-decoration: line-through;
  font-size: 12px;
}
.product-card .actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.product-card .actions .btn {
  flex: 1;
}
.heart {
  background: #fff;
  border: 0;
  position: absolute;
  top: 10px;
  inset-inline-start: 10px;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  box-shadow: 0 2px 8px #0002;
  color: #6a7474;
}
.heart.liked {
  color: #e3292f;
}
.promo-banner {
  position: relative;
  min-height: 196px;
  display: flex;
  align-items: center;
  border-radius: 15px;
  overflow: hidden;
  background: linear-gradient(110deg,#061518,#152b2d 60%,#422216);
  color: #fff;
  padding: 27px 34px;
}
.promo-banner:after {
  content: "✦";
  position: absolute;
  inset-inline-end: 10%;
  font-size: 210px;
  color: #ffffff0d;
  line-height: 1;
}
.promo-banner h2 {
  font-size: 30px;
  position: relative;
  z-index: 1;
}
.promo-banner p {
  max-width: 530px;
  color: #bdd0d0;
  font-size: 13px;
  margin: 8px 0 15px;
}
.promo-banner img {
  position: absolute;
  inset-inline-end: 0;
  top: 0;
  height: 100%;
  width: 42%;
  object-fit: cover;
  opacity: .53;
  mask-image: linear-gradient(to left,#000,transparent);
}
.split-promo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 17px;
}
.split-promo .promo-banner {
  min-height: 160px;
}
.split-promo h2 {
  font-size: 23px;
}
.bundle-card {
  padding: 22px;
  background: linear-gradient(135deg,#fff,#f3f4f4);
}
.bundle-card .bundle-symbol {
  font-size: 48px;
}
.bundle-card h3 {
  margin: 6px 0;
}
.article-card .imgbox {
  height: 150px;
}
.article-card .article-copy {
  padding: 16px;
}
.faq-item {
  border-bottom: 1px solid var(--line);
  padding: 15px 0;
}
.faq-item summary {
  cursor: pointer;
  font-weight: 800;
}
.faq-item p {
  padding: 10px;
  color: var(--muted);
}
/* Secondary views */
.page-hero {
  background: linear-gradient(110deg,#0c1a1c,#1b3438);
  color: #fff;
  padding: 39px 0;
  margin-bottom: 12px;
}
.page-hero p {
  color: #c0cfcf;
  margin-top: 7px;
  font-size: 13px;
}
.shop-layout {
  display: grid;
  grid-template-columns: 245px 1fr;
  gap: 20px;
}
.filters {
  padding: 18px;
  align-self: start;
  position: sticky;
  top: 69px;
}
.filters h3 {
  margin-bottom: 14px;
}
.product-list {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 15px;
}
.product-list .photo {
  height: 180px;
}
.detail-layout {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,1fr);
  gap: 30px;
}
.detail-cover {
  min-height: 400px;
  max-height: 490px;
  display: grid;
  place-items: center;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.detail-cover img {
  height: 100%;
  max-height: 490px;
  object-fit: contain;
}
.gallery-thumbs {
  display: flex;
  gap: 9px;
  margin-top: 10px;
}
.gallery-thumbs img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid #dae1e3;
}
.detail-info h1 {
  font-size: 29px;
}
.detail-info p {
  margin: 13px 0;
  color: var(--muted);
}
.qty-control {
  display: flex;
  align-items: center;
  gap: 8px;
}
.qty-control button {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  padding: 5px 12px;
  font-size: 19px;
}
.cart-layout,.checkout-layout {
  display: grid;
  grid-template-columns: 1.65fr 1fr;
  gap: 20px;
}
.cart-line {
  display: grid;
  grid-template-columns: 76px 1fr auto;
  gap: 14px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
  align-items: center;
}
.cart-line img {
  width: 76px;
  height: 70px;
  object-fit: contain;
  background: #f3f4f5;
  border-radius: 9px;
}
.sum-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 10px 0;
}
.sum-row.total {
  border-top: 1px solid var(--line);
  margin-top: 16px;
  padding-top: 15px;
  font-size: 21px;
  font-weight: 900;
}
.steps {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.step {
  background: #edf1f2;
  border-radius: 20px;
  padding: 4px 13px;
  color: #657778;
  font-size: 12px;
}
.step.on {
  background: #243c3f;
  color: #fff;
}
.panel-title {
  margin: 0 0 16px;
  font-weight: 900;
  font-size: 19px;
}
.padded {
  padding: 23px;
}
.stat {
  padding: 18px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
}
.stat strong {
  font-size: 26px;
  font-weight: 900;
  display: block;
}
.tag {
  background: #e8eff0;
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.status-received,.status-pending,.status-new {
  background: #fff1c9;
  color: #896a00;
}
.status-delivered,.status-completed,.status-confirmed {
  background: #daf4e9;
  color: #257653;
}
.status-cancelled,.status-rejected {
  background: #ffe3e3;
  color: #a62f2f;
}
.admin-layout {
  display: grid;
  grid-template-columns: 235px 1fr;
  gap: 20px;
}
.admin-side {
  background: #142426;
  color: #e5eeee;
  border-radius: 13px;
  padding: 15px;
  align-self: start;
  position: sticky;
  top: 70px;
  max-height: calc(100vh - 90px);
  overflow: auto;
}
.admin-side a {
  display: block;
  padding: 9px 12px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 800;
}
.admin-side a:hover,.admin-side a.active {
  background: #ffffff19;
  color: var(--primary);
}
.admin-panel {
  min-width: 0;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  font-size: 12px;
}
.data-table th,.data-table td {
  text-align: start;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  max-width: 280px;
  overflow-wrap: anywhere;
}
.data-table th {
  color: #607378;
  background: #f6f8f8;
  font-size: 11px;
}
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fff;
}
.data-table button {
  white-space: nowrap;
}
.settings-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}
.settings-grid .field {
  margin: 0;
}
.record-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
}
.visual-option {
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.visual-option img {
  width: 55px;
  height: 55px;
  object-fit: cover;
}
.sticky-summary {
  position: sticky;
  top: 70px;
}
.callout {
  background: #152729;
  color: #fff;
  border-radius: 13px;
  padding: 22px;
}
.callout p {
  color: #bdd1d1;
}
.timeline {
  padding: 12px 0;
}
.timeline .milestone {
  padding: 10px 24px 10px 0;
  border-right: 2px solid var(--line);
  position: relative;
}
.timeline .milestone:before {
  content: "";
  position: absolute;
  right: -6px;
  top: 17px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #b1c0c3;
}
.timeline .milestone.done:before {
  background: #188e79;
}
.article-body {
  white-space: pre-wrap;
  line-height: 2.1;
}
.map-frame {
  border: 0;
  border-radius: var(--radius);
  width: 100%;
  height: 280px;
}
/* Banners custom content */
.banner-strip {
  background: #10272a;
  color: #fff;
  border-radius: 12px;
  min-height: 100px;
  overflow: hidden;
  position: relative;
  margin: 12px 0 24px;
  display: flex;
  align-items: center;
}
.banner-strip img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: .42;
}
.banner-strip .body {
  position: relative;
  padding: 20px 32px;
  z-index: 2;
}
.banner-strip .body p {
  font-size: 12px;
}
.page-with-aside {
  display: grid;
  grid-template-columns: 1fr 240px;
  gap: 20px;
}
.banner-sidebar {
  align-self: start;
  height: 300px;
}
/* Modal/chat */
.overlay {
  position: fixed;
  z-index: 110;
  inset: 0;
  background: #0b141bc4;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
}
.dialog {
  background: #fff;
  width: min(650px,100%);
  max-height: 94vh;
  overflow: auto;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 28px 100px #0005;
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}
.close {
  display: grid;
  place-items: center;
  border: 0;
  background: #edf2f2;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 21px;
}
.close .icon-svg {
  width: 18px;
  height: 18px;
}
.toast-stack {
  position: fixed;
  bottom: 22px;
  left: 22px;
  z-index: 160;
  display: grid;
  gap: 10px;
}
.toast {
  background: #0d2729;
  color: #fff;
  padding: 12px 18px;
  min-width: 220px;
  max-width: 350px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  font-size: 13px;
}
.toast.error {
  background: #a02828;
}
.assistant-btn {
  display: grid;
  place-items: center;
  position: fixed;
  z-index: 80;
  bottom: 25px;
  right: 26px;
  border: 3px solid #fff;
  background: linear-gradient(135deg,#0f5768,#1b7e93);
  color: #fff;
  width: 63px;
  height: 63px;
  border-radius: 50%;
  box-shadow: 0 7px 21px #123d4670;
  animation: floaty 3.5s ease-in-out infinite;
}
.assistant-btn .icon-svg {
  width: 28px;
  height: 28px;
}
.assistant-window {
  position: fixed;
  z-index: 100;
  bottom: 98px;
  right: 25px;
  width: min(390px,calc(100vw - 30px));
  height: min(560px,78vh);
  background: white;
  border-radius: 18px;
  box-shadow: 0 17px 55px #0b202663;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.assistant-head {
  background: #102a30;
  color: #fff;
  padding: 14px 17px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.assistant-head .close {
  background: #ffffff1a;
  color: #fff;
}
.assistant-messages {
  flex: 1;
  overflow: auto;
  padding: 14px;
  background: #f7faf9;
  color: var(--ink);
}
.msg {
  background: #fff;
  border: 1px solid #e3ecec;
  border-radius: 12px 12px 4px 12px;
  padding: 12px 14px;
  margin-bottom: 10px;
  max-width: 92%;
  font-size: 13px;
  color: #172326;
  white-space: pre-wrap;
  line-height: 1.8;
  box-shadow: 0 4px 14px #1231;
}
.msg.user {
  margin-inline-start: auto;
  border-radius: 12px 12px 12px 4px;
  background: #e7f7db;
  border-color: #d7ecc9;
}
.assistant-form {
  display: flex;
  gap: 7px;
  padding: 11px;
  border-top: 1px solid var(--line);
  background: #fff;
}
.assistant-form input {
  min-width: 0;
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  background: #fff;
  color: #172326;
}
.assistant-form button {
  display: grid;
  place-items: center;
  border: 0;
  background: #173f43;
  color: white;
  padding: 10px 13px;
  border-radius: 12px;
  min-width: 56px;
}
.assistant-form button .icon-svg {
  width: 18px;
  height: 18px;
}
.chat-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 6px;
}
.chip {
  border: 1px solid #c9dcdd;
  border-radius: 100px;
  background: #fff;
  color: #173538;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 800;
  min-height: 38px;
  box-shadow: 0 2px 8px #00000008;
}
.chip:hover {
  background: #fff9dc;
  border-color: #f1d159;
}
.inline-media {
  display: flex;
  gap: 7px;
  align-items: center;
}
.inline-media input {
  flex: 1;
  min-width: 0;
}
.upload-previews {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.upload-previews img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 8px;
}
.icon-svg {
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* footer */
.footer {
  background: #0e1b1d;
  color: #c6d0d2;
  margin-top: 50px;
  padding: 37px 0 16px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1.5fr 1.2fr;
  gap: 25px;
}
.footer h3 {
  color: white;
  font-size: 15px;
  margin-bottom: 14px;
}
.footer p,.footer a {
  font-size: 12px;
}
.footer a {
  display: block;
  line-height: 2.2;
}
.footer a:hover {
  color: var(--primary);
}
.footer .brand-logo {
  width: 93px;
  height: 71px;
  margin-bottom: 9px;
}
.footer-bottom {
  border-top: 1px solid #ffffff1b;
  margin-top: 28px;
  padding-top: 15px;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
}
.reveal {
  opacity: 0;
  transform: translateY(17px);
  transition: opacity .5s,transform .5s;
}
.reveal.visible {
  opacity: 1;
  transform: none;
}
@keyframes floaty {
  50% {
    transform: translateY(-4px);
  }
}
@media (max-width:1080px) {
  .finder {
    margin: -16px 20px 0;
    grid-template-columns: repeat(3,1fr);
  }
  .finder>div:first-child {
    grid-column: 1/-1;
  }
  .services-grid {
    grid-template-columns: repeat(2,1fr);
  }
  .grid-4 {
    grid-template-columns: repeat(3,1fr);
  }
  .categories {
    grid-template-columns: repeat(4,1fr);
  }
  .navband .inside {
    gap: 14px;
    overflow-x: auto;
  }
  .footer-grid {
    grid-template-columns: repeat(2,1fr);
  }
}
@media (max-width:760px) {
  .container {
    padding: 0 15px;
  }
  .topbar .inside {
    height: 65px;
    gap: 12px;
  }
  .brand-logo {
    width: 78px;
    height: 57px;
  }
  .quick-icons {
    gap: 6px;
  }
  .quick-icon {
    min-width: 44px;
    font-size: 9px;
    padding: 3px;
  }
  .quick-icon .icon-badge {
    width: 34px;
    height: 34px;
  }
  .quick-icon .icon-svg {
    width: 18px;
    height: 18px;
  }
  .topbar .searchbar {
    display: none;
  }
  .navband .inside {
    min-height: 43px;
  }
  .navband .inside>a {
    display: none;
  }
  .hamburger {
    display: block;
  }
  .nav-special {
    margin-inline-start: auto;
    padding: 10px;
  }
  .hero,.hero-inner {
    min-height: 370px;
  }
  .hero-inner {
    padding: 54px 23px;
  }
  .hero h1 {
    font-size: 38px;
  }
  .hero:before {
    background: linear-gradient(90deg,#10151645,#0b1316ce);
  }
  .hero-visual {
    background-position: 44% center;
  }
  .finder {
    grid-template-columns: 1fr 1fr;
    padding: 14px;
    margin: -18px 13px 0;
  }
  .finder>div:first-child {
    grid-column: 1/-1;
  }
  .finder>.field:nth-of-type(1) {
    grid-column: 1/-1;
  }
  .finder .btn {
    grid-column: 1/-1;
  }
  .section {
    padding: 22px 0;
  }
  .section-head h2 {
    font-size: 21px;
  }
  .grid-4,.grid-3,.product-list {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 10px;
  }
  .product-card .photo,.product-list .photo {
    height: 145px;
  }
  .product-card .details {
    padding: 10px;
  }
  .product-card h3 {
    font-size: 12px;
    min-height: 38px;
  }
  .price {
    font-size: 15px;
  }
  .categories {
    grid-template-columns: repeat(4,1fr);
    gap: 12px;
  }
  .cat-symbol {
    font-size: 31px;
  }
  .cat-item {
    font-size: 10px;
  }
  .services-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 10px;
  }
  .service-tile {
    min-height: 130px;
    padding: 14px;
  }
  .service-tile strong {
    font-size: 13px;
  }
  .service-tile .service-symbol {
    font-size: 58px;
  }
  .promo-banner {
    min-height: 180px;
    padding: 22px;
  }
  .promo-banner h2 {
    font-size: 22px;
  }
  .split-promo,.detail-layout,.cart-layout,.checkout-layout,.shop-layout,.admin-layout,.page-with-aside {
    grid-template-columns: 1fr;
  }
  .filters,.admin-side,.sticky-summary {
    position: static;
  }
  .admin-side {
    max-height: none;
  }
  .admin-side .admin-nav-list {
    display: flex;
    overflow: auto;
    gap: 5px;
  }
  .admin-side a {
    white-space: nowrap;
  }
  .detail-cover {
    min-height: 270px;
  }
  .detail-info h1 {
    font-size: 25px;
  }
  .form-grid,.settings-grid,.record-grid {
    grid-template-columns: 1fr;
  }
  .footer-grid {
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  .footer-bottom {
    display: block;
  }
  .banner-sidebar {
    height: 180px;
  }
}
@media (max-width:380px) {
  .categories {
    grid-template-columns: repeat(4,1fr);
  }
  .topbar .quick-icons .quick-icon:nth-child(3) {
    display: none;
  }
  .grid-4,.product-list {
    grid-template-columns: 1fr 1fr;
  }
  .hero h1 {
    font-size: 32px;
  }
  .finder {
    grid-template-columns: 1fr;
  }
  .finder>.field {
    grid-column: 1/-1;
  }
  .footer-grid {
    grid-template-columns: 1fr;
  }
}
@media (prefers-reduced-motion:reduce) {
  *,*:before,*:after {
    animation: none !important;
    scroll-behavior: auto !important;
    transition: none !important;
  }
  .reveal {
    opacity: 1;
    transform: none;
  }
}
/* Reliable original branding */
.brand-lockup {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 112px;
  height: 75px;
  overflow: hidden;
  background: #050505;
  border-radius: 8px;
  flex-shrink: 0;
  vertical-align: middle;
}
.brand-lockup .brand-logo {
  display: block;
  width: 100%;
  height: 100%;
  padding: 4px;
  object-fit: contain;
  object-position: center;
  background: #050505;
  border-radius: 0;
}
.brand-lockup .brand-wordmark {
  color: #fff;
  font: 900 17px/1.05 Arial,sans-serif;
  text-align: center;
  white-space: nowrap;
}
.brand-lockup .brand-wordmark b {
  color: #ed242c;
}
.brand-lockup .brand-wordmark small {
  display: block;
  color: #ffd13b;
  font-size: 13px;
  letter-spacing: 1px;
}
@media (max-width:760px) {
  .brand-lockup {
    width: 81px;
    height: 57px;
  }
}
/* CUSTOMER REFERENCE DESIGN — compact black/white/gold storefront */
:root {
  --primary: #ffcc38;
  --dark: #0b1718;
  --bg: #f6f7f7;
  --radius: 11px;
  --shadow: 0 5px 17px rgba(18,33,35,.07);
}
body {
  background: #f8f9f9;
  font-size: 13px;
  line-height: 1.65;
}
.container {
  max-width: 1260px;
  padding-inline: 20px;
}
.section {
  padding-block: 16px;
}
.section-head {
  margin-bottom: 12px;
}
.section-head h2 {
  font-size: 21px;
}
.section-head .overline {
  display: none;
}
.topbar .inside {
  height: 71px;
  gap: 18px;
}
.topbar .brand-logo {
  width: 89px;
  height: 57px;
  padding: 3px;
  border-radius: 3px;
  background: #0a0c0c;
}
.quick-icons {
  gap: 10px;
}
.quick-icon {
  min-width: 55px;
  gap: 2px;
  padding: 3px;
  font-size: 10px;
}
.quick-icon .icon-badge {
  width: 28px;
  height: 27px;
  background: transparent;
  border: 0;
  box-shadow: none;
  border-radius: 4px;
}
.quick-icon .icon-svg {
  width: 19px;
  height: 19px;
}
.counter {
  top: -4px;
}
.searchbar {
  height: 38px;
  max-width: 500px;
}
.searchbar input {
  font-size: 11px;
}
.searchbar button {
  width: 31px;
  height: 31px;
}
.navband .inside {
  min-height: 42px;
  gap: 3px;
  flex-wrap: nowrap;
  justify-content: center;
}
.navband a {
  padding: 9px 11px;
  border-radius: 0;
  font-size: 11px;
}
.navband a.active {
  background: transparent;
  color: var(--primary);
  box-shadow: inset 0 -3px var(--primary);
}
.navband a:hover {
  background: #1d2b2c;
  color: var(--primary);
  box-shadow: inset 0 -3px var(--primary);
}
.navband .nav-special {
  background: transparent;
  color: var(--primary) !important;
  padding: 9px 9px;
  box-shadow: none;
  margin-inline-start: 0;
}
.hero {
  min-height: 390px;
}
.hero-inner {
  min-height: 390px;
  align-items: flex-start;
  padding: 38px 6%;
}
.hero h1 {
  font-size: clamp(31px,4vw,56px);
  font-weight: 900;
  max-width: 490px;
}
.hero h1 em {
  color: var(--primary);
}
.hero p {
  font-size: 12px;
  max-width: 365px;
  margin: 10px 0 17px;
}
.hero .kicker {
  display: none;
}
.hero:before {
  background: linear-gradient(270deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.65) 32%,rgba(0,0,0,.06) 77%);
}
.hero-inner {
  align-items: flex-end;
  text-align: right;
}
.hero-inner h1,.hero-inner p {
  width: 100%;
  margin-inline-start: auto;
}
.hero-actions {
  width: 100%;
  justify-content: flex-start;
}
.hero .btn {
  padding: 9px 21px;
  border-radius: 5px;
  font-size: 12px;
}
.hero .btn.outline {
  border-color: #ddd;
}
.hero-dots {
  bottom: 9px;
}
.finder {
  max-width: 1210px;
  margin: -14px auto 4px;
  border-radius: 9px;
  grid-template-columns: 1.25fr repeat(3,1fr) auto;
  padding: 11px 13px;
  gap: 8px;
  box-shadow: 0 8px 25px #101e2214;
}
.finder h3 {
  font-size: 12px;
}
.finder p {
  font-size: 10px;
}
.finder .field label {
  display: none;
}
.finder .field select {
  min-height: 39px;
  font-size: 11px;
  padding: 6px;
}
.finder .btn {
  min-height: 39px;
  padding: 7px 16px;
  border-radius: 5px;
  background: #0e5960;
}
.categories {
  grid-template-columns: repeat(8,minmax(0,1fr));
  gap: 13px;
}
.cat-circle {
  border: 2px solid #fff;
  max-width: 104px;
  background: linear-gradient(145deg,#fff,#ebeded);
  box-shadow: 0 3px 12px #00000013;
}
.cat-circle img {
  object-fit: cover;
}

const route = () => {
  const hash = window.location.hash || '';

  // Supabase may return authentication data after #
  // This is not a website route.
  if (
    /^#(?:access_token=|refresh_token=|error=|error_code=|error_description=)/.test(hash)
  ) {
    return '/';
  }

  try {
    return decodeURI((hash.slice(1).split('?')[0]) || '/');
  } catch {
    return '/';
  }
};

function applyTheme() {

  const d = get('design_settings').find(x => x.key === 'theme')?.value || {
  };
  const set = (key, v, reg) => {
    if (typeof v === 'string' && reg.test(v)) document.documentElement.style.setProperty(key, v)
  };
  set('--primary', d.primary, /^#[0-9a-fA-F]{6}$/);
  set('--accent', d.accent, /^#[0-9a-fA-F]{6}$/);
  set('--dark', d.dark, /^#[0-9a-fA-F]{6}$/);
  set('--surface', d.surface, /^#[0-9a-fA-F]{6}$/);
  if (Number(d.fontSize) >= 12 && Number(d.fontSize) <= 22) document.documentElement.style.setProperty('--fz', d.fontSize + 'px');
  if (Number(d.headingSize) >= 28 && Number(d.headingSize) <= 70) document.documentElement.style.setProperty('--h1', d.headingSize + 'px');
  if (Number(d.radius) >= 0 && Number(d.radius) <= 30) document.documentElement.style.setProperty('--radius', d.radius + 'px');
  const fav = safeUrl(d.faviconUrl);
  if (fav) {
    let el = document.querySelector('link[rel="icon"]');
    if (!el) {
      el = document.createElement('link');
      el.rel = 'icon';
      document.head.appendChild(el)
    }
    el.href = fav;
  }
  const fonts = {
    Cairo: "'Cairo',sans-serif",
    Inter: "'Inter',sans-serif",
    Tahoma: 'Tahoma,sans-serif'
  };
  if (fonts[d.font]) document.documentElement.style.setProperty('--font', fonts[d.font]);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
}

async function syncRemoteCart() {

  if (!state.user || !state.db) return;
  try {

    const { data, error } = await state.db.from('carts').upsert({
      user_id: state.user.id
    }, {
      onConflict: 'user_id'
    }).select('id').single();
    if (error) throw error;
    const del = await state.db.from('cart_items').delete().eq('cart_id', data.id);
    if (del.error) throw del.error;
    if (state.cart.length) {
      const { error: e } = await state.db.from('cart_items').insert(state.cart.map(x => ({
        cart_id: data.id,
        product_id: x.kind === 'product' ? x.id : null,
        bundle_id: x.kind === 'bundle' ? x.id : null,
        quantity: x.quantity
      })));
      if (e) throw e
    }
  } catch (e) {
    console.warn('Cart sync:', e.message)
  }
}
function addCart(id, amount = 1, kind = 'product', show = true) {

  const obj = kind === 'bundle' ? by('bundles', id) : by('products', id);
  if (!obj || !obj.is_active) return toast(txt('العنصر غير متاح', 'Item unavailable'), true);
  amount = Math.min(99, Math.max(1, Number(amount) || 1));
  if (kind === 'product' && qty(id) < amount) return toast(txt('الكمية المطلوبة غير متوفرة', 'Not enough stock'), true);
  const line = state.cart.find(x => x.id === id && x.kind === kind);
  if (line) {
    const n = line.quantity + amount;
    if (n > 99 || (kind === 'product' && qty(id) < n)) return toast(txt('الكمية غير متوفرة', 'Quantity unavailable'), true);
    line.quantity = n
  } else state.cart.push({
    id,
    kind,
    quantity: amount
  });
  cartStore();
  header();
  if (show) toast(txt('اتضاف للسلة', 'Added to cart'))
}
function changeCart(id, kind, delta) {

  const x = state.cart.find(v => v.id === id && v.kind === kind);
  if (!x) return;
  x.quantity += delta;
  if (x.quantity < 1) state.cart = state.cart.filter(v => v !== x);
  else if (kind === 'product' && x.quantity > qty(id)) {
    x.quantity--;
    return toast(txt('لا يوجد مخزون كافي', 'Not enough stock'), true)
  }
  cartStore();
  header();
  render()
}

async function compressImageIfNeeded(file) {

  if (file.size <= 5 * 1024 * 1024 || file.type === 'image/gif') return file;
  try {

    const bitmap = await createImageBitmap(file);
    const ratio = Math.min(1, 1800 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * ratio);
    canvas.height = Math.round(bitmap.height * ratio);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .82));
    if (blob && blob.size <= 5 * 1024 * 1024) return new File([
      blob
    ], file.name.replace(/\.[^.]+$/, '.jpg'), {
      type: 'image/jpeg'
    });

  } catch (e) {
    console.warn('Image compression:', e)
  }
  return file;
}
async function mediaSelected(input) {

  const files = [
    ...input.files
  ].slice(0, 6);
  let done = 0;
  for (const file of files) {

    try {
      if (![
        'image/jpeg',
        'image/png',
        'image/webp',
        'image/gif'
      ].includes(file.type)) throw Error('UNSUPPORTED_IMAGE_TYPE_OR_SIZE');
      $('media-progress').textContent = `${txt('جاري رفع', 'Uploading')} ${file.name} (${done + 1}/${files.length})`;
      const uploadFile = await compressImageIfNeeded(file);
      const form = new FormData();
      form.set('image', uploadFile);
      const d = await callEdge('upload-image', form, true);
      attachMediaUrl(d.url);
      done++;

    } catch (e) {
      toast(friendlyError(e), true)
    }
  }
  if (done) {
    closeModal();
    toast(txt('تم رفع الصور وربطها تلقائيًا', 'Images uploaded and linked automatically'));
  }
}

    'RATE_LIMIT_SALT_NOT_CONFIGURED': txt('خدمة الموقع لم تُهيأ بعد.', 'Service not configured.')
  };
  const found = Object.keys(pairs).find(x => s.includes(x));

async function actionBusy(form, fn) {

  const b = form.querySelector('button[type=submit],button:not([type])');
  if (b) {
    b.disabled = true;
    b.dataset.old = b.textContent;
    b.textContent = txt('جاري التنفيذ...', 'Working...')
  }
  try {
    return await fn()
  } finally {
    if (b) {
      b.disabled = false;
      b.textContent = b.dataset.old || b.textContent
    }
  }
}
async function callEdge(name, payload, isForm = false) {

  if (!CONFIG.supabaseUrl) return Promise.reject(Error('SUPABASE_NOT_CONFIGURED'));
  const token = (await state.db?.auth.getSession())?.data?.session?.access_token;
  const response = await fetch(CONFIG.supabaseUrl + '/functions/v1/' + name, {

    method: 'POST',
    headers: {
      'apikey': CONFIG.publishableKey,
      'Authorization': 'Bearer ' + (token || CONFIG.publishableKey),
      ...(!isForm ? {
        'Content-Type': 'application/json'
      } : {
      })

    },
    body: isForm ? payload : JSON.stringify(payload)
  });
  const data = await response.json().catch(() => ({
    error: 'SERVER_ERROR'
  }));
  if (!response.ok || data.error) throw Error(data.error || 'REQUEST_FAILED');
  return data;
}
async function dbInsert(table, obj) {
  if (!state.db) throw Error('DATABASE_UNAVAILABLE');
  const { data, error } = await state.db.from(table).insert(obj).select('*').maybeSingle();
  if (error) throw error;
  return data
}
async function dbUpdate(table, id, obj) {
  if (!state.db) throw Error('DATABASE_UNAVAILABLE');
  const { data, error } = await state.db.from(table).update(obj).eq('id', id).select('*').maybeSingle();
  if (error) throw error;
  return data
}
async function dbDelete(table, id) {
  const { error } = await state.db.from(table).delete().eq('id', id);
  if (error) throw error;
}

function editAdminRecord(section, id) {

async function saveAdminRecord(section, id, form) {

  const specs = fieldsFor(section), f = new FormData(form), obj = {
  };
  for (const spec of specs) {

    const [key, kind = ''] = spec.split(':');
    let value;
    if (kind === 'image') value = $('admin-media-' + key)?.value.trim() || null;
    else if (kind === 'bool') value = f.get(key) === 'on';
    else {

      value = String(f.get(key) || '').trim();
      if (value === '') value = null;
      else if ([
        'int',
        'num'
      ].includes(kind)) value = Number(value); else if (kind === 'array') value = value.split(',').map(x => x.trim()).filter(Boolean); else if (kind === 'datetime') value = new Date(value).toISOString();
    }
    obj[key] = value;
  }
  const key = keyCol(section);
  try {

    const q = state.db.from(section);
    let result;
    if (id) {
      const rec = get(section).find(x => String(x[key]) === id);
      if (!rec) throw Error('RECORD_NOT_FOUND');
      result = await q.update(obj).eq(key, id)
    }
    else result = await q.insert(obj);
    if (result.error) throw result.error;
    closeModal();
    await loadAdminData();
    render();
    toast(txt('تم حفظ التغييرات', 'Changes saved'));

  } catch (e) {
    toast(friendlyError(e), true)
  }
}
async function deleteAdminRecord(section, id) {

  if (!confirm(txt('متأكد من حذف السجل؟ الحذف قد يؤثر على بيانات مرتبطة.', 'Delete this record? Related data could be affected.'))) return;
  try {
    const { error } = await state.db.from(section).delete().eq(keyCol(section), id);
    if (error) throw error;
    await loadAdminData();
    render();
    toast(txt('تم الحذف', 'Deleted'))
  } catch (e) {
    toast(friendlyError(e), true)
  }
}

async function continueBookingFlow(input) {

async function fetchTable(table, limit = 500) {

  if (!state.db) return [
  ];
  let accumulated = [
  ];
  let start = 0;
  const page = 200;
  while (start < limit) {

    let q = state.db.from(table).select(table === 'products' ? 'id,sku,barcode,name_ar,name_en,slug,description_ar,description_en,category_id,brand_id,price,compare_at_price,is_active,featured,universal_fit,keywords,created_at,updated_at' : '*').range(start, Math.min(start + page - 1, limit - 1));
    const { data, error } = await q;
    if (error) {
      console.warn('Read denied/unavailable:', table, error.message);
      break
    }
    accumulated.push(...(data || [
    ]));
    if (!data || data.length < page) break;
    start += page
  }
  return accumulated;
}

function hydrateBike(prefix, b) {

  if (!b || !$(`${prefix}-brand`)) return;
  const model = by('motorcycle_models', b.model_id), brand = b.brand_id || model?.brand_id;
  $(`${prefix}-brand`).value = brand || '';
  fillBikeModels(prefix);
  $(`${prefix}-model`).value = b.model_id || '';
  fillBikeYears(prefix);
  $(`${prefix}-year`).value = String(b.year || '');
}

  if (path === '/') html = home(); else if (key === 'shop') html = shop(); else if (key === 'offers') html = shopOffers(); else if (key === 'product') html = productDetail(seg[1]);
  else if (key === 'bundles') html = bundlesPage(); else if (key === 'bundle') html = bundleDetail(seg[1]);
  else if (key === 'bikes') html = bikesPage(); else if (key === 'bike') html = bikeDetail(seg[1]);

  else if (key === 'account') html = accountPage(); else if (key === 'orders') html = ordersPage(); else if (key === 'bookings') html = bookingsPage(); else if (key === 'favorites') html = favoritesPage();

  else if (key === 'admin') html = adminPage(seg[1] || 'overview'); else html = notFound();

function observeReveal() {

  const elements = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    elements.forEach(x => x.classList.add('visible'));
    return
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        io.unobserve(e.target)
      }
    })
  }, {
    threshold: .06
  });
  elements.forEach(x => io.observe(x));
}

async function boot() {
  render();
  if (!window.supabase) {
    toast(txt('تعذر الاتصال بخدمة الحسابات', 'Authentication service unavailable'), true);
    return;
  }
  state.db = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.publishableKey, {
    auth: {
      persistSession: true,
      autoRefreshToken: true
    }
  });
  try {
    const { data, error } = await state.db.auth.getUser();
    if (error && error.name !== 'AuthSessionMissingError') console.warn('Session unavailable');
    state.user = data?.user || null;
    await loadPublic();
    if (state.user) await loadPrivate();
    state.loading = false;
    render();
    state.db.auth.onAuthStateChange((event, session) => {
      if (session?.user?.id === state.user?.id) return;
      state.user = session?.user || null;
      setTimeout(async () => {
        if (state.user) await loadPrivate(); else {
          state.roles = [
          ];
          state.staff = false;
          state.data.profiles = [
          ];
        }
        render();

      }, 0);

    });

  } catch (e) {
    console.error('Store initialization failed');
    state.loading = false;
    render();
    toast(txt('تعذر تحميل بيانات المتجر', 'Store data unavailable'), true);
  }
}
document.addEventListener('DOMContentLoaded', boot);
